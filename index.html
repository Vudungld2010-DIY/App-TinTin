<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Góc Học Tập TinTin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: kệ sách — tiêu đề ngắn, rồi lưới các "cuốn vở" (mỗi app một màu bìa); mở app thì app chiếm toàn màn hình, có thanh quay về */
:root{
  --bg:#f6f3ea; --surface:#fffdf7; --ink:#24302a; --muted:#66706a; --line:#e3ddcc;
  --blue:#2f7fd8; --blue-ink:#ffffff; --green:#2f6b45; --green-ink:#f4fbef;
  --sun:#ffc93c; --sun-ink:#3d2d00; --spine:rgba(0,0,0,.14);
  --display:"Baloo 2","Nunito",system-ui,sans-serif;
  --body:"Nunito",system-ui,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15171a; --surface:#1e2125; --ink:#ebe8df; --muted:#a3a59f; --line:#30343a;
  --blue:#3d8be0; --blue-ink:#ffffff; --green:#2f6b45; --green-ink:#f4fbef;
  --sun:#f5bd2e; --sun-ink:#2b1f00; --spine:rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15171a; --surface:#1e2125; --ink:#ebe8df; --muted:#a3a59f; --line:#30343a;
  --blue:#3d8be0; --blue-ink:#ffffff; --green:#2f6b45; --green-ink:#f4fbef;
  --sun:#f5bd2e; --sun-ink:#2b1f00; --spine:rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.home{max-width:980px;margin:0 auto;padding:28px 16px 40px;display:flex;flex-direction:column;gap:26px}
header{display:flex;flex-direction:column;gap:4px}
.today{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,7vw,56px);line-height:1;margin:0;text-wrap:balance}
header p{margin:6px 0 0;color:var(--muted);font-weight:700;max-width:52ch}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.book{all:unset;box-sizing:border-box;cursor:pointer;position:relative;display:flex;flex-direction:column;gap:10px;min-height:220px;padding:20px 20px 18px 34px;border-radius:8px 18px 18px 8px;color:var(--c-ink);background:var(--c);box-shadow:0 2px 0 var(--spine),0 10px 24px -14px rgba(0,0,0,.5);transition:transform .15s}
.book::before{content:"";position:absolute;inset:0 auto 0 0;width:16px;border-radius:8px 0 0 8px;background:var(--spine)}
.book:hover{transform:translateY(-3px) rotate(-.4deg)}
.book:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.book .tag{align-self:flex-start;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:rgba(255,255,255,.2);padding:3px 10px;border-radius:999px}
.book h2{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.05;margin:0}
.book p{margin:0;font-weight:700;opacity:.92}
.book ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.book li{font-size:13px;font-weight:800;background:rgba(0,0,0,.16);padding:3px 9px;border-radius:8px}
.book .glyph{position:absolute;right:16px;top:12px;font-family:var(--display);font-weight:800;font-size:44px;opacity:.28;line-height:1}
.next{border:2px dashed var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:8px;color:var(--muted);background:var(--surface)}
.next h2{font-family:var(--display);font-size:22px;margin:0;color:var(--ink)}
.next p{margin:0;font-weight:700}
.next ul{margin:0;padding-left:18px;font-weight:700}
/* Màn hình app */
.viewer{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);z-index:10}
.bar{display:flex;align-items:center;gap:12px;padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px;background:var(--surface);border-bottom:1px solid var(--line)}
.bar button{border:0;background:var(--ink);color:var(--bg);font:800 15px var(--body);padding:8px 14px;border-radius:12px;cursor:pointer}
.bar button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.bar strong{font-family:var(--display);font-size:20px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.viewer iframe{flex:1;width:100%;border:0;background:#fff}
@media (prefers-reduced-motion:reduce){.book{transition:none}.book:hover{transform:none}}
</style>
</head>
<body>

<main class="home" id="home">
  <header>
    <span class="today" id="today"></span>
    <h1>Góc Học Tập TinTin</h1>
    <p>Chọn một cuốn vở để bắt đầu học. Mỗi app tự nhớ tiến độ trên máy này.</p>
  </header>

  <section class="shelf" aria-label="Các ứng dụng">
    <button class="book" data-app="tienganh" style="--c:var(--blue);--c-ink:var(--blue-ink)">
      <span class="glyph" aria-hidden="true">ABC</span>
      <span class="tag">Tiếng Anh · Lớp 4</span>
      <h2>Tiếng Anh 4</h2>
      <p>Global Success Unit 1–4: từ vựng có hình, nghe phát âm, ngữ pháp và luyện tập.</p>
      <ul><li>Từ vựng</li><li>Ngữ pháp</li><li>Flashcard</li><li>Trắc nghiệm</li><li>Điền từ</li></ul>
    </button>
    <button class="book" data-app="toan" style="--c:var(--green);--c-ink:var(--green-ink)">
      <span class="glyph" aria-hidden="true">+−×</span>
      <span class="tag">Toán · Lớp 1–5</span>
      <h2>Toán Tiểu Học</h2>
      <p>Luyện tính nhanh 10 câu mỗi lượt, có bàn phím số, chấm sao và xem lại câu sai.</p>
      <ul><li>Cộng trừ</li><li>Nhân chia</li><li>So sánh</li><li>Tìm x</li><li>Bảng cửu chương</li></ul>
    </button>
    <div class="next">
      <h2>App tiếp theo</h2>
      <p>Kệ này còn chỗ. Một vài ý tưởng có thể thêm:</p>
      <ul><li>Chính tả Tiếng Việt</li><li>Học xem đồng hồ</li><li>Từ vựng tự nhập (bố mẹ tự thêm từ)</li><li>Theo dõi thời gian học mỗi ngày</li></ul>
    </div>
  </section>
</main>

<div class="viewer" id="viewer" hidden>
  <div class="bar"><button id="back" type="button">← Kệ sách</button><strong id="appTitle"></strong></div>
  <iframe id="frame" title="Ứng dụng" allow="autoplay"></iframe>
</div>

<script>
const APPS={
  tienganh:{title:"Tiếng Anh 4",src:"apps/tieng-anh-4.html"},
  toan:{title:"Toán Tiểu Học",src:"apps/toan.html"}
};
const home=document.getElementById("home"),viewer=document.getElementById("viewer"),frame=document.getElementById("frame");
function openApp(id,push){
  const a=APPS[id];if(!a)return closeApp(false);
  document.getElementById("appTitle").textContent=a.title;
  if(frame.dataset.app!==id){frame.src=a.src;frame.dataset.app=id}
  viewer.hidden=false;home.hidden=true;
  if(push)try{history.pushState(null,"","#"+id)}catch(e){location.hash=id}
}
function closeApp(push){
  viewer.hidden=true;home.hidden=false;
  if(push)try{history.pushState(null,"",location.pathname+location.search)}catch(e){location.hash=""}
}
document.querySelectorAll("[data-app]").forEach(b=>b.addEventListener("click",()=>openApp(b.dataset.app,true)));
document.getElementById("back").addEventListener("click",()=>closeApp(true));
window.addEventListener("popstate",()=>{const h=location.hash.slice(1);h&&APPS[h]?openApp(h,false):closeApp(false)});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);h&&APPS[h]?openApp(h,false):closeApp(false)});
const d=new Date();
document.getElementById("today").textContent=d.toLocaleDateString("vi-VN",{weekday:"long",day:"numeric",month:"long"});
const start=location.hash.slice(1);if(APPS[start])openApp(start,false);
</script>
</body>
</html>
